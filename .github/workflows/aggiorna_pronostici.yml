name: Automazione LopisLab

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # Questo dà il permesso esplicito di scrivere nel repository
      contents: write
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Installa le librerie necessarie
        run: pip install requests

      - name: Eseguire lo script dei pronostici
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python cron_update.py

      - name: Salva i risultati e pubblica sul sito
        run: |
          git config --global user.name 'LopisLab-Robot'
          git config --global user.email 'robot@lopislab.com'
          git add index.html
          git commit -m "Aggiornamento automatico pronostici" || exit 0
          git push
