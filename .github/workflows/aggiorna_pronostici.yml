name: Automazione LopisLab

on:
  schedule:
    # Si attiva ogni mattina alle 06:00 UTC (circa le 08:00 in Italia)
    - cron: '0 6 * * *'
  workflow_dispatch: # Questo ti permette di farlo partire a mano quando vuoi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installa le librerie necessarie
        run: pip install requests

      - name: Eseguire lo script dei pronostici
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python main.py

      - name: Salva i risultati e pubblica sul sito
        run: |
          git config --global user.name 'LopisLab-Robot'
          git config --global user.email 'robot@lopislab.com'
          git add index.html
          git commit -m "Aggiornamento automatico pronostici" || exit 0
          git push
