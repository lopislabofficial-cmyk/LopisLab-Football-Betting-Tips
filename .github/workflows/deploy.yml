name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main  # Assicurati che il tuo ramo principale si chiami 'main', altrimenti scrivi 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Questo è il comando magico per Pages
          command: pages deploy ./ --project-name=lopislab-football-tips
